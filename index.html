<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cork Driver Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #ffffff;
    }

    header {
      padding: 24px 20px;
      background: #0b1220;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      color: #9ca3af;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .search-box {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 17px;
      outline: none;
    }

    .search-box:focus {
      border-color: #60a5fa;
    }

    .section-title {
      margin-top: 28px;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .destination {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      color: #d1d5db;
      margin: 5px 0;
    }

    .label {
      color: #9ca3af;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 30px 10px;
    }

    .notice {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #172033;
      border: 1px solid #374151;
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.5;
    }
  </style>
</head>

<body>

    <p>Scroll & Route Information</p>
  </header>

    <div class="notice">
      <strong>DRIVER SAFETY NOTICE</strong><br><br>
      Cork Driver Helper must only be used when the vehicle is safely parked,

      <br><br>
      <strong>Do not use this application while driving.</strong>
    </div>

    const results = document.getElementById("results");
    const search = document.getElementById("search");

    function displayResults(items) {
      if (items.length === 0) {
        results.innerHTML =
          '<div class="empty">No matching scrolls found.</div>';
        return;
      }

      results.innerHTML = items.map(item => `
        <div class="card">
          <div class="destination">${item.destination}</div>
          <div class="info">
            <span class="label">Scroll:</span>
            ${item.scroll}
          </div>
          <div class="info">
            <span class="label">Route:</span>
            ${item.route || "General / No route assigned"}
          </div>
        </div>
      `).join("");
    }

    function searchScrolls() {
      const query = search.value.toLowerCase().trim();

      if (!query) {
        displayResults(scrolls);
        return;
      }

      const filtered = scrolls.filter(item =>
        item.scroll.toLowerCase().includes(query) ||
        item.destination.toLowerCase().includes(query) ||
        item.route.toLowerCase().includes(query)
      );

      displayResults(filtered);
    }

    search.addEventListener("input", searchScrolls);

    displayResults(scrolls);
