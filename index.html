<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🚍 Cork Driver Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #ffffff;
    }

    header {
      background: #0b1220;
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid #273449;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 10px 0 0;
      color: #9ca3af;
      font-size: 18px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 18px 50px;
    }

    .search-box {
      width: 100%;
      padding: 18px 20px;
      border-radius: 20px;
      border: 2px solid #6ea8fe;
      background: #202b3d;
      color: white;
      font-size: 20px;
      outline: none;
      margin-bottom: 28px;
    }

    .search-box::placeholder {
      color: #8d98a9;
    }

    .search-box:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
    }

    h2 {
      font-size: 26px;
      margin: 10px 0 20px;
    }

    #loading {
      text-align: center;
      color: #9ca3af;
      padding: 30px;
      font-size: 18px;
    }

    #error {
      display: none;
      background: #451a1a;
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    #results {
      display: grid;
      gap: 18px;
    }

    .card {
      background: #202b3d;
      border: 1px solid #334155;
      border-radius: 22px;
      padding: 24px 28px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
    }

    .card h3 {
      margin: 0 0 14px;
      font-size: 23px;
      line-height: 1.3;
    }

    .info {
      margin: 8px 0;
      color: #b8c0cc;
      font-size: 18px;
    }

    .label {
      color: #e5e7eb;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #26364d;
      color: #cbd5e1;
      font-size: 14px;
    }

    .no-results {
      text-align: center;
      padding: 35px 15px;
      color: #9ca3af;
      font-size: 18px;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 30px 15px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      .container {
        padding: 22px 14px 40px;
      }

      .card {
        padding: 20px;
      }

      .card h3 {
        font-size: 21px;
      }

      .info {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🚍 Cork Driver Helper</h1>
  <p>Scroll &amp; Route Information</p>
</header>

<div class="container">

  <input
    id="search"
    class="search-box"
    type="text"
    placeholder="Search destination, scroll or route..."
    autocomplete="off"
  >

  <div id="error"></div>

  <h2>Scroll Information</h2>

  <div id="loading">
    Loading driver information...
  </div>

  <div id="results"></div>

</div>

<footer>
  Cork Driver Helper
</footer>


<script type="module">

  /*
   * ============================================================
   * FIREBASE CONFIGURATION
   * ============================================================
   *
   * Replace the values below with the configuration from:
   * Firebase Console → Project settings → Your apps → Web app
   *
   * DO NOT change the names of the fields.
   */

  const firebaseConfig = {
    apiKey: "AIzaSyD_mVNVqFc4kX9loDK0sdBZOMnh2396ghI",
    authDomain: "cork-driver-helper.firebaseapp.com",
    projectId: "cork-driver-helper",
    storageBucket: "cork-driver-helper.firebasestorage.app",
    messagingSenderId: "1073459449103",
    appId: "1:1073459449103:web:30ab72e4ee3dd9bddd427a",
    measurementId: "G-P8PFY2X658"
  };


  /*
   * ============================================================
   * FIREBASE
   * ============================================================
   */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  /*
   * ============================================================
   * ELEMENTS
   * ============================================================
   */

  const search = document.getElementById("search");
  const results = document.getElementById("results");
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");


  /*
   * ============================================================
   * DATA
   * ============================================================
   */

  let scrolls = [];


  /*
   * ============================================================
   * LOAD DATA FROM FIRESTORE
   * ============================================================
   *
   * Firestore collection:
   *
   * destinations
   *
   */

  async function loadData() {

    try {

      loading.style.display = "block";
      errorBox.style.display = "none";

      const snapshot = await getDocs(
        collection(db, "destinations")
      );

      scrolls = [];

      snapshot.forEach((doc) => {

        const data = doc.data();

        scrolls.push({
          id: doc.id,
          destination: data.destination || "",
          scroll: data.scrollNumber ?? "",
          route: data.routeNumber || "",
          garage: data.garage || "",
          notes: data.notes || "",
          status: data.status || ""
        });

      });

      loading.style.display = "none";

      searchScrolls();

    } catch (error) {

      console.error(error);

      loading.style.display = "none";

      errorBox.style.display = "block";

      errorBox.innerHTML =
        "<strong>Unable to load the driver information.</strong><br><br>" +
        "Firebase error: " +
        escapeHtml(error.message);

    }

  }


  /*
   * ============================================================
   * DISPLAY RESULTS
   * ============================================================
   */

  function displayResults(items) {

    results.innerHTML = "";

    if (items.length === 0) {

      results.innerHTML =
        '<div class="no-results">No driver information found.</div>';

      return;
    }


    items.forEach((item) => {

      const card = document.createElement("div");

      card.className = "card";


      let html = "";

      html += `
        <h3>${escapeHtml(item.destination || "Unknown destination")}</h3>
      `;


      if (item.scroll !== "") {

        html += `
          <div class="info">
            <span class="label">Scroll:</span>
            ${escapeHtml(String(item.scroll))}
          </div>
        `;

      }

html += `
    <div class="info">
        <span class="label">Route:</span>
        ${escapeHtml(String(item.route || ""))}
    </div>
`;


      if (item.garage !== "") {

        html += `
          <div class="info">
            <span class="label">Garage:</span>
            ${escapeHtml(String(item.garage))}
          </div>
        `;

      }


      if (item.notes !== "") {

        html += `
          <div class="info">
            <span class="label">Notes:</span>
            ${escapeHtml(String(item.notes))}
          </div>
        `;

      }


      if (item.status !== "") {

        html += `
          <div class="status">
            ${escapeHtml(String(item.status))}
          </div>
        `;

      }


      card.innerHTML = html;

      results.appendChild(card);

    });

  }


  /*
   * ============================================================
   * SEARCH
   * ============================================================
   */

  function searchScrolls() {

    const query = search.value
      .toLowerCase()
      .trim();


    if (!query) {

      displayResults(scrolls);

      return;

    }


    const filtered = scrolls.filter((item) => {

      return (

        String(item.destination)
          .toLowerCase()
          .includes(query)

        ||

        String(item.scroll)
          .toLowerCase()
          .includes(query)

        ||

        String(item.route)
          .toLowerCase()
          .includes(query)

        ||

        String(item.garage)
          .toLowerCase()
          .includes(query)

        ||

        String(item.notes)
          .toLowerCase()
          .includes(query)

      );

    });


    displayResults(filtered);

  }


  /*
   * ============================================================
   * SECURITY
   * ============================================================
   */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /*
   * ============================================================
   * EVENTS
   * ============================================================
   */

  search.addEventListener(
    "input",
    searchScrolls
  );


  /*
   * ============================================================
   * START
   * ============================================================
   */

  loadData();

</script>

</body>
</html>
